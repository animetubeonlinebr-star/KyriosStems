<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso administrativo — KyriosStems</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d1114">
  <meta name="color-scheme" content="dark">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/admin.css">

  <script type="module" src="js/pages/login.js"></script>
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-card__brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="10" rx="2"/>
            <path d="M8 10V7a4 4 0 018 0v3"/>
          </svg>
        </span>
        <h1 class="login-card__title">KyriosStems</h1>
        <p class="login-card__subtitle">Acesso administrativo</p>
      </div>

      <noscript>
        <p class="alert alert--error" role="alert">
          O acesso administrativo depende de JavaScript. Ative-o para entrar.
        </p>
      </noscript>

      <form class="login-card__form" data-login-form novalidate>
        <div class="field">
          <label class="field__label" for="email">E-mail</label>
          <input type="email" id="email" name="email" class="input"
                 autocomplete="username" required placeholder="seu@email.com">
        </div>
        <div class="field">
          <label class="field__label" for="password">Senha</label>
          <input type="password" id="password" name="password" class="input"
                 autocomplete="current-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn--primary btn--block" data-login-submit>
          Entrar no painel
        </button>
        <div data-feedback role="alert"></div>
      </form>

      <div class="login-card__footer">
        <a href="index.html">← Voltar ao catálogo</a>
      </div>
    </div>
  </div>
</body>
</html>
