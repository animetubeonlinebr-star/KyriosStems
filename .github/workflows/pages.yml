name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publica em GitHub Pages. O repositório guarda apenas o código; os metadados
# vivem no Firestore e os arquivos no Google Drive, ambos acessados direto pelo
# navegador. Não há servidor para hospedar.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A verificação não depende de rede: confere imports, classes de estilo e
      # assets das páginas. Os testes das rules exigem o emulador e o console do
      # Firebase configurados, então rodam localmente, não aqui.
      - name: Conferir integridade do projeto
        run: node tests/check-project.js

  deploy:
    name: Publicar
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publica apenas os arquivos da aplicação. Testes, scripts e documentação
      # não vão para o site.
      - name: Preparar artefato
        run: |
          mkdir -p dist
          cp -r index.html song.html login.html admin.html css js assets dist/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4