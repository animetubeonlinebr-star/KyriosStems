<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro — KyriosStems</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d1114">
  <meta name="color-scheme" content="dark">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/cadastro.css">

  <script type="module" src="js/pages/cadastro.js"></script>
</head>
<body>
  <main class="cadastro-shell">
    <div class="cadastro-card">
      <span class="cadastro-badge">Tela temporária</span>

      <div class="cadastro-card__brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="10" rx="2"/>
            <path d="M8 10V7a4 4 0 018 0v3"/>
          </svg>
        </span>
        <h1 class="cadastro-card__title">KyriosStems</h1>
        <p class="cadastro-card__subtitle">Cadastro de acesso</p>
      </div>

      <noscript>
        <p class="alert alert--error" role="alert">
          Esta tela depende de JavaScript. Ative-o para cadastrar.
        </p>
      </noscript>

      <form class="cadastro-card__form" data-cadastro-form novalidate>
        <div class="field">
          <label class="field__label" for="email">E-mail</label>
          <input type="email" id="email" name="email" class="input"
                 autocomplete="username" required placeholder="seu@email.com">
        </div>
        <div class="field">
          <label class="field__label" for="senha">Senha</label>
          <input type="password" id="senha" name="senha" class="input"
                 autocomplete="new-password" required placeholder="mínimo 6 caracteres">
          <p class="field__hint">A senha é guardada pelo Firebase Authentication, nunca por esta página.</p>
        </div>
        <div class="field">
          <label class="field__label" for="confirmacao">Confirme a senha</label>
          <input type="password" id="confirmacao" name="confirmacao" class="input"
                 autocomplete="new-password" required placeholder="repita a senha">
        </div>

        <button type="submit" class="btn btn--primary btn--block" data-cadastro-submit>
          Cadastrar
        </button>

        <div data-feedback role="alert"></div>
      </form>

      <div data-registrations></div>

      <div class="cadastro-card__footer">
        <a href="catalogo.html">← Voltar ao catálogo</a>
      </div>
    </div>
  </main>
</body>
</html>
