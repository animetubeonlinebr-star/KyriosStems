<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KyriosStems — Personal Worship Multitrack Library</title>
  <meta name="description" content="Biblioteca pessoal de sessões musicais de louvor preparadas para utilização em DAWs.">
  <meta name="theme-color" content="#0d1114">
  <meta name="color-scheme" content="dark">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/catalog.css">

  <script type="module" src="js/pages/catalog.js"></script>
</head>
<body class="page">
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>

  <header data-header></header>

  <main class="page__main" id="conteudo">
    <section class="catalog-hero" data-hero></section>

    <div class="container">
      <div data-notices></div>
      <div data-toolbar></div>
      <div class="results-bar" data-results-bar role="status" aria-live="polite"></div>
      <div data-results>
        <div class="loading-state">
          <div class="spinner" aria-hidden="true"></div>
          <span>Carregando biblioteca...</span>
        </div>
      </div>
    </div>
  </main>

  <footer data-footer></footer>
  <div data-bottom-nav></div>

  <noscript>
    <div class="container">
      <p class="alert alert--error mt-6">
        O KyriosStems depende de JavaScript para carregar o catálogo. Ative-o para ver a biblioteca.
      </p>
    </div>
  </noscript>
</body>
</html>
